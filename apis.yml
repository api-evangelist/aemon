name: Aemon
description: Aemon is an autonomous AI research-and-development engineer founded in
  2025 by Ray Xu and Richard Zhou and backed by Y Combinator (Winter 2026 batch).
  Given an engineering problem and a measurable objective, Aemon reads state-of-the-art
  research, then generates, tests, and evolves thousands of candidate approaches at
  machine speed to discover optimal solutions that can exceed what human experts find.
  The team demonstrated the approach by setting a new world record on the NP-hard
  circle-packing optimization problem for under $10 of compute, beating a prior Google
  DeepMind result. Aemon is an early-stage, demo-first enterprise product headquartered
  in San Francisco; as of this profile it publishes no public developer API, SDKs,
  or documentation surface.
